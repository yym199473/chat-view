<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>聊天记录</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#ededed;
  color:#191919;
  font-family:-apple-system,BlinkMacSystemFont,
  "PingFang SC","Microsoft YaHei",Arial,sans-serif;
}

.header{
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:#ededed;
  border-bottom:1px solid #ddd;
}

.back{
  position:absolute;
  left:16px;
  font-size:30px;
}

.title{
  font-size:17px;
  font-weight:600;
}

.more{
  position:absolute;
  right:18px;
  font-size:22px;
}

.card{
  margin:12px;
  background:white;
  border-radius:6px;
  overflow:hidden;
}

.card-title{
  padding:17px 16px 10px;
  font-size:17px;
  font-weight:600;
}

.chat{
  padding:0 16px;
}

.item{
  display:flex;
  padding:15px 0;
  border-bottom:1px solid #eeeeee;
}

.item:last-child{
  border-bottom:0;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:4px;
  background:#07c160;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:20px;
  flex:none;
}

.content{
  margin-left:11px;
  flex:1;
}

.name{
  color:#576b95;
  font-size:14px;
  margin-bottom:5px;
}

.text{
  font-size:16px;
  line-height:1.55;
  word-break:break-word;
}

.time{
  color:#b2b2b2;
  font-size:12px;
  margin-top:6px;
}

.footer{
  padding:15px;
  text-align:center;
  color:#999;
  font-size:12px;
}
</style>
</head>

<body>

<div class="header">
  <div class="back">‹</div>
  <div class="title">聊天记录</div>
  <div class="more">•••</div>
</div>

<div class="card">

  <div class="card-title">
    聊天记录
  </div>

  <div class="chat">

    <div class="item">
      <div class="avatar">A</div>

      <div class="content">
        <div class="name">用户A</div>

        <div class="text">
          这里是第一条聊天内容。
        </div>

        <div class="time">
          2026年8月31日 03:45
        </div>
      </div>
    </div>


    <div class="item">
      <div class="avatar">B</div>

      <div class="content">
        <div class="name">用户B</div>

        <div class="text">
          这里是第二条聊天内容，之后可以直接修改这里的文字。
        </div>

        <div class="time">
          2026年8月31日 03:46
        </div>
      </div>
    </div>


    <div class="item">
      <div class="avatar">A</div>

      <div class="content">
        <div class="name">用户A</div>

        <div class="text">
          网站部署测试成功。
        </div>

        <div class="time">
          2026年8月31日 03:47
        </div>
      </div>
    </div>

  </div>

  <div class="footer">
    聊天记录展示页面
  </div>

</div>

</body>
</html>
