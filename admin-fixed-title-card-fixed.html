<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>聊天记录编辑器</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#111}
.wrap{max-width:720px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:20px;margin:4px 0 14px}
label{font-size:13px;color:#666;display:block;margin:10px 0 6px}
input,textarea{width:100%;border:1px solid #ddd;border-radius:8px;padding:11px;font-size:16px;background:#fff}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.msg{border-top:1px solid #eee;padding-top:12px;margin-top:12px}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{border:0;border-radius:8px;padding:11px 14px;font-size:15px}
.primary{background:#07c160;color:#fff}
.light{background:#eee}
.danger{background:#ffe9e9;color:#b21d1d}
.preview{display:flex;align-items:center;gap:10px}
.preview img{width:56px;height:56px;border-radius:8px;object-fit:cover}
.small{font-size:12px;color:#888;line-height:1.5}
.status{font-size:13px;margin-top:10px;white-space:pre-wrap;color:#555}
.ok{color:#16823b}
.err{color:#c62828}
</style>
</head>
<body>
<div class="wrap">

<div class="card">
  <h2>只有你自己用的编辑器</h2>
  <div class="small">首次使用需要输入 GitHub Fine-grained Token。Token 只保存在你这台手机的浏览器 localStorage，不会写进网页源码。</div>
  <label>GitHub Token</label>
  <input id="token" type="password" placeholder="github_pat_...">
  <div class="buttons">
    <button class="light" id="saveTokenBtn" type="button">保存 Token 到本机</button>
    <button class="light" id="clearTokenBtn" type="button">清除 Token</button>
  </div>
  <div id="tokenStatus" class="status"></div>
</div>

<div class="card">
  <label>分享卡片标题</label><input id="shareTitle">
  <label>分享卡片摘要（换行会变成空格显示）</label><textarea id="shareDescription"></textarea>
  <label>打开网页后的顶部标题</label><input id="pageTitle">
  <label>日期</label><input id="date">
  <label>底部“聊天记录”等文字</label><input id="footer">
</div>

<div class="card">
  <h2>头像</h2>
  <div class="preview">
    <img id="avatarPreview" src="avatar.jpg">
    <input id="avatarFile" type="file" accept="image/*">
  </div>
</div>

<div class="card">
  <h2>消息</h2>
  <div id="messages"></div>
  <div class="buttons"><button class="light" id="addMessageBtn" type="button">＋添加消息</button></div>
</div>

<div class="card">
  <div class="buttons"><button class="primary" id="saveAllBtn" type="button">保存并发布</button></div>
  <div id="saveStatus" class="status"></div>
</div>

</div>

<script>
const OWNER='yym199473';
const REPO='chat-view';
const BRANCH='main';
let data={records:[]};

const $ = (id) => document.getElementById(id);

function getToken(){
  return $('token').value.trim();
}

function setTokenStatus(msg, ok=true){
  const el=$('tokenStatus');
  el.textContent=msg;
  el.className='status ' + (ok?'ok':'err');
}

function setSaveStatus(msg, ok=true){
  const el=$('saveStatus');
  el.textContent=msg;
  el.className='status ' + (ok?'ok':'err');
}

function saveToken(){
  const t=getToken();
  if(!t){
    setTokenStatus('请先粘贴 Token。', false);
    return;
  }
  try{
    localStorage.setItem('gh_token', t);
    setTokenStatus('✓ Token 已保存到这台手机。');
  }catch(e){
    setTokenStatus('保存失败：浏览器阻止了本地存储。', false);
  }
}

function clearToken(){
  localStorage.removeItem('gh_token');
  $('token').value='';
  setTokenStatus('Token 已清除。');
}

async function load(){
  $('token').value=localStorage.getItem('gh_token')||'';
  try{
    const r=await fetch('data.json?ts='+Date.now(),{cache:'no-store'});
    data=await r.json();
    $('shareTitle').value=data.shareTitle||data.pageTitle||'wR~与糯米的聊天记录';
    $('shareDescription').value=data.shareDescription||'';
    $('pageTitle').value=data.pageTitle||'';
    $('date').value=data.date||'';
    $('footer').value=data.footer||'';
    renderMessages();
  }catch(e){
    setSaveStatus('读取 data.json 失败：'+e.message,false);
  }
}

function renderMessages(){
  const box=$('messages');
  box.innerHTML='';
  (data.records||[]).forEach((m,i)=>{
    const d=document.createElement('div');
    d.className='msg';
    d.innerHTML=`
      <div class="row">
        <div><label>姓名</label><input data-k="name"></div>
        <div><label>时间</label><input data-k="time"></div>
      </div>
      <label>内容</label><textarea data-k="text"></textarea>
      <div class="buttons"><button class="danger" type="button">删除这条</button></div>`;
    d.querySelector('[data-k="name"]').value=m.name||'';
    d.querySelector('[data-k="time"]').value=m.time||'';
    d.querySelector('[data-k="text"]').value=m.text||'';
    d.querySelectorAll('[data-k]').forEach(el=>{
      el.addEventListener('input',()=>{data.records[i][el.dataset.k]=el.value;});
    });
    d.querySelector('.danger').addEventListener('click',()=>{
      data.records.splice(i,1);
      renderMessages();
    });
    box.appendChild(d);
  });
}

function addMessage(){
  data.records.push({name:'wR~',time:'',text:''});
  renderMessages();
}

async function gh(path,opts={}){
  const t=getToken();
  if(!t) throw new Error('请先输入并保存 GitHub Token');
  const r=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path,{
    ...opts,
    headers:{
      'Accept':'application/vnd.github+json',
      'Authorization':'Bearer '+t,
      'X-GitHub-Api-Version':'2022-11-28',
      ...(opts.headers||{})
    }
  });
  if(!r.ok){
    const txt=await r.text();
    throw new Error(path+'：HTTP '+r.status+' '+txt);
  }
  return r.json();
}

function b64utf8(s){
  const bytes=new TextEncoder().encode(s);
  let bin='';
  bytes.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin);
}

function utf8b64(s){
  const bin=atob(s.replace(/\n/g,''));
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

async function putText(path,text,msg){
  let sha=null;
  try{ sha=(await gh(path)).sha; }catch(e){}
  return gh(path,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      message:msg,
      content:b64utf8(text),
      branch:BRANCH,
      ...(sha?{sha}:{})
    })
  });
}

async function putBinary(path,base64,msg){
  let sha=null;
  try{ sha=(await gh(path)).sha; }catch(e){}
  return gh(path,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      message:msg,
      content:base64,
      branch:BRANCH,
      ...(sha?{sha}:{})
    })
  });
}

function safeAttr(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

async function saveAll(){
  try{
    setSaveStatus('正在保存…');
    data.pageTitle=($('pageTitle').value||'').trim() || 'wR~与糯米的聊天记录';
    data.shareTitle=data.pageTitle;
    if($('shareTitle')) $('shareTitle').value=data.shareTitle;
    data.shareDescription=(data.records||[])
      .filter(x => x && (x.text||'').trim())
      .slice(0,2)
      .map(x => `${x.name||'wR~'}：${(x.text||'').trim().replace(/\s+/g,' ')}`)
      .join('｜');
    data.date=$('date').value;
    data.footer=$('footer').value;
    if($('shareDescription')) $('shareDescription').value=data.shareDescription;

    const f=$('avatarFile').files[0];
    if(f){
      const base64=await new Promise((resolve,reject)=>{
        const fr=new FileReader();
        fr.onload=()=>resolve(fr.result.split(',')[1]);
        fr.onerror=reject;
        fr.readAsDataURL(f);
      });
      await putBinary('avatar.jpg',base64,'Update avatar');
    }

    await putText('data.json',JSON.stringify(data,null,2),'Update chat content');

    const ix=await gh('index.html');
    let html=utf8b64(ix.content);
    const desc=data.shareDescription.replace(/\n/g,' ');

    html=html
      .replace(/<title>.*?<\/title>/s,'<title>'+safeAttr(data.pageTitle)+'</title>')
      .replace(/<meta name="description" content=".*?">/s,'<meta name="description" content="'+safeAttr(desc)+'">')
      .replace(/<meta property="og:title" content=".*?">/s,'<meta property="og:title" content="'+safeAttr(data.pageTitle)+'">')
      .replace(/<meta property="og:description" content=".*?">/s,'<meta property="og:description" content="'+safeAttr(desc)+'">');

    await gh('index.html',{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        message:'Update share metadata',
        content:b64utf8(html),
        branch:BRANCH,
        sha:ix.sha
      })
    });

    const v=Date.now();
    setSaveStatus('✓ 保存成功。\n公开页面：https://yym199473.github.io/chat-view/?v='+v+'\n重新分享到微信时请优先使用上面这个带 v 参数的新网址，这样更容易刷新卡片缓存。');
  }catch(e){
    setSaveStatus('保存失败：'+e.message,false);
  }
}

$('saveTokenBtn').addEventListener('click',saveToken);
$('clearTokenBtn').addEventListener('click',clearToken);
$('addMessageBtn').addEventListener('click',addMessage);
$('saveAllBtn').addEventListener('click',saveAll);

$('avatarFile').addEventListener('change',(e)=>{
  const f=e.target.files[0];
  if(f) $('avatarPreview').src=URL.createObjectURL(f);
});

load();
</script>
</body>
</html>
