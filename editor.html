<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>卡片封面修改器</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f5f5f5;color:#111;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:18px 14px 40px}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 8px rgba(0,0,0,.05)}
h1{font-size:20px;margin:0 0 14px}
.tip{font-size:13px;color:#777;line-height:1.6;margin-bottom:14px}
label{display:block;font-size:13px;color:#555;margin:13px 0 6px}
input,textarea{width:100%;border:1px solid #ddd;border-radius:8px;padding:11px 12px;font-size:16px;background:#fff;outline:none}
textarea{min-height:88px;resize:vertical;line-height:1.5}
input:focus,textarea:focus{border-color:#07c160}
.row{display:flex;gap:10px;margin-top:14px}
button{flex:1;border:0;border-radius:8px;padding:12px 10px;font-size:16px;cursor:pointer}
.primary{background:#07c160;color:#fff}.secondary{background:#eee;color:#222}
.status{margin-top:14px;padding:10px 12px;border-radius:8px;font-size:14px;line-height:1.5;display:none}
.ok{display:block;background:#edf9f1;color:#16783a}.err{display:block;background:#fff0f0;color:#b42318}.wait{display:block;background:#f2f6ff;color:#3157a4}
.preview{margin-top:18px;border-top:1px solid #eee;padding-top:16px}
.preview-box{display:flex;align-items:center;gap:12px;border:1px solid #e8e8e8;border-radius:8px;padding:12px;background:#fff}
.preview-text{min-width:0;flex:1}.preview-title{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview-desc{margin-top:7px;font-size:13px;color:#777;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.preview-img{width:56px;height:56px;border-radius:4px;object-fit:cover;background:#f3f3f3}
.small{font-size:12px;color:#999;margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>卡片封面修改器</h1>
    <div class="tip">只修改分享卡片封面，不改聊天页面布局、时间、头像或聊天内容。保存时会直接更新 GitHub 仓库里的 <b>index.html</b>。</div>

    <label>GitHub 令牌（PAT）</label>
    <input id="token" type="password" placeholder="粘贴你的 GitHub Fine-grained token" autocomplete="off">
    <div class="small">令牌只用于本次保存，不写入网页、不保存到本地。请不要截图或发给别人。</div>

    <label>封面标题</label>
    <input id="title" type="text" maxlength="100" placeholder="例如：wR~与糯米的聊天记录">

    <label>封面摘要</label>
    <textarea id="desc" maxlength="300" placeholder="例如：wR~：这里可以修改聊天内容｜wR~：777"></textarea>

    <label>封面图片网址</label>
    <input id="image" type="url" placeholder="https://.../white.jpg">

    <div class="row">
      <button class="secondary" id="loadBtn">读取当前封面</button>
      <button class="primary" id="saveBtn">保存封面</button>
    </div>

    <div id="status" class="status"></div>

    <div class="preview">
      <div class="small" style="margin:0 0 8px">预览</div>
      <div class="preview-box">
        <div class="preview-text">
          <div class="preview-title" id="pTitle">封面标题</div>
          <div class="preview-desc" id="pDesc">封面摘要</div>
        </div>
        <img class="preview-img" id="pImg" alt="">
      </div>
    </div>
  </div>
</div>
<script>
const OWNER='yym199473';
const REPO='chat-view';
const PATH='index.html';
const BRANCH='main';
const API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}?ref=${encodeURIComponent(BRANCH)}`;

const $=id=>document.getElementById(id);
const setStatus=(msg,type='wait')=>{const e=$('status');e.textContent=msg;e.className='status '+type;};

function utf8ToBase64(str){
  const bytes=new TextEncoder().encode(str);
  let binary='';
  for(let i=0;i<bytes.length;i++) binary+=String.fromCharCode(bytes[i]);
  return btoa(binary);
}
function base64ToUtf8(b64){
  const binary=atob(b64.replace(/\n/g,''));
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function escReg(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function getAttr(html, selector, attr='content'){
  let re;
  if(selector==='title') re=/<title>([\s\S]*?)<\/title>/i;
  else if(selector.startsWith('property:')) re=new RegExp(`<meta\\s+property=["']${escReg(selector.slice(9))}["']\\s+content=["']([^"']*)["'][^>]*>`,`i`);
  else re=new RegExp(`<meta\\s+name=["']${escReg(selector.slice(5))}["']\\s+content=["']([^"']*)["'][^>]*>`,`i`);
  const m=html.match(re); return m?m[1]:'';
}
function replaceMeta(html,key,value){
  const safe=value.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let re;
  if(key==='title') return html.replace(/<title>[\s\S]*?<\/title>/i,`<title>${safe}</title>`);
  if(key.startsWith('property:')){
    const name=key.slice(9); re=new RegExp(`(<meta\\s+property=["']${escReg(name)}["']\\s+content=["'])[^"']*(["'][^>]*>)`,`i`);
  }else{
    const name=key.slice(5); re=new RegExp(`(<meta\\s+name=["']${escReg(name)}["']\\s+content=["'])[^"']*(["'][^>]*>)`,`i`);
  }
  return html.replace(re,`$1${safe}$2`);
}
function updatePreview(){
  $('pTitle').textContent=$('title').value||'封面标题';
  $('pDesc').textContent=$('desc').value||'封面摘要';
  $('pImg').src=$('image').value||'';
}
['title','desc','image'].forEach(id=>$(id).addEventListener('input',updatePreview));

async function githubGet(){
  const token=$('token').value.trim();
  const headers={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  if(token) headers['Authorization']='Bearer '+token;
  const r=await fetch(API,{headers,cache:'no-store'});
  if(!r.ok) throw new Error(`读取失败：HTTP ${r.status}`);
  return r.json();
}

$('loadBtn').onclick=async()=>{
  try{
    setStatus('正在读取当前封面…','wait');
    const j=await githubGet();
    const html=base64ToUtf8(j.content);
    $('title').value=getAttr(html,'property:og:title')||getAttr(html,'title');
    $('desc').value=getAttr(html,'property:og:description')||getAttr(html,'name:description');
    $('image').value=getAttr(html,'property:og:image');
    updatePreview();
    setStatus('读取成功。可以修改后点“保存封面”。','ok');
  }catch(e){setStatus(e.message,'err');}
};

$('saveBtn').onclick=async()=>{
  const token=$('token').value.trim();
  if(!token){setStatus('请先填写 GitHub 令牌。','err');return;}
  const title=$('title').value.trim();
  const desc=$('desc').value.trim();
  const image=$('image').value.trim();
  if(!title||!desc||!image){setStatus('标题、摘要和图片网址都要填写。','err');return;}
  try{
    setStatus('正在保存到 GitHub…','wait');
    const j=await githubGet();
    let html=base64ToUtf8(j.content);
    html=replaceMeta(html,'title',title);
    html=replaceMeta(html,'name:description',desc);
    html=replaceMeta(html,'property:og:title',title);
    html=replaceMeta(html,'property:og:description',desc);
    html=replaceMeta(html,'property:og:image',image);

    const body={message:'Update card cover',content:utf8ToBase64(html),sha:j.sha,branch:BRANCH};
    const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`,{
      method:'PUT',
      headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    if(!r.ok){
      let detail='';try{detail=(await r.json()).message||'';}catch(_){ }
      throw new Error(`保存失败：HTTP ${r.status}${detail?' - '+detail:''}`);
    }
    setStatus('保存成功。GitHub Pages 通常几十秒到几分钟更新；微信旧卡片可能还有缓存。','ok');
  }catch(e){setStatus(e.message,'err');}
};

$('loadBtn').click();
</script>
</body>
</html>
