<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>聊天内容与封面修改器</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f5f5f5;color:#111;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:16px 12px 40px}.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:12px;box-shadow:0 1px 8px rgba(0,0,0,.05)}
h1{font-size:20px;margin:0 0 12px}.section-title{font-size:16px;font-weight:600;margin:0 0 8px}.tip,.small{font-size:12px;color:#888;line-height:1.5}
label{display:block;font-size:13px;color:#555;margin:12px 0 6px}input,textarea{width:100%;border:1px solid #ddd;border-radius:8px;padding:10px 11px;font-size:16px;background:#fff;outline:none}textarea{min-height:72px;resize:vertical;line-height:1.45}
input:focus,textarea:focus{border-color:#07c160}.record{border:1px solid #eee;border-radius:9px;padding:10px;margin-top:10px}.record-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.record textarea{margin-top:8px}
.actions{display:flex;gap:10px;margin-top:14px;position:sticky;bottom:8px}.actions button{flex:1;border:0;border-radius:9px;padding:12px 10px;font-size:16px}.primary{background:#07c160;color:#fff}.secondary{background:#eee;color:#222}.danger{background:#fff0f0;color:#b42318;border:1px solid #ffd0d0!important}.add{width:100%;margin-top:10px;border:1px dashed #bbb;background:#fafafa;border-radius:8px;padding:10px;font-size:14px}
.status{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.5;display:none}.ok{display:block;background:#edf9f1;color:#16783a}.err{display:block;background:#fff0f0;color:#b42318}.wait{display:block;background:#f2f6ff;color:#3157a4}
.preview{display:flex;align-items:center;gap:12px;border:1px solid #eee;border-radius:8px;padding:11px;margin-top:10px}.preview-text{flex:1;min-width:0}.preview-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview-desc{font-size:13px;color:#777;margin-top:6px;line-height:1.45;white-space:pre-line;overflow:hidden}.preview img{width:56px;height:56px;object-fit:cover;border-radius:4px;background:#f4f4f4}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>聊天内容与卡片封面修改器</h1>
    <div class="tip">里面聊天内容和外层分享卡片都可以修改。公开页面的原布局、头像大小和时间样式不改。</div>
    <label>GitHub 令牌（PAT）</label>
    <input id="token" type="password" placeholder="保存时粘贴 GitHub Fine-grained token" autocomplete="off">
    <div class="small">令牌只在本次页面里使用，不会写进仓库。</div>
  </div>

  <div class="card">
    <div class="section-title">里面聊天内容</div>
    <label>聊天记录标题</label><input id="pageTitle" type="text">
    <label>日期</label><input id="date" type="text" placeholder="例如：2026年8月31日">
    <label>底部文字</label><input id="footer" type="text">
    <div id="records"></div>
    <button class="add" id="addRecord">＋ 添加一条聊天</button>
    <label>第一个聊天内容头像</label>
    <input id="avatarFile" type="file" accept="image/*">
    <div class="small">只修改里面第一条聊天内容的头像；封面卡片图片保持原来的白色图片不变。</div>
    <div class="preview">
      <div class="preview-text"><div class="preview-title">第一个内容头像预览</div><div class="preview-desc">只更换第一条内容头像，原内容格式、尺寸、文字、时间和封面白色图片全部不变。</div></div>
      <img id="avatarPreview" alt="">
    </div>
  </div>

  <div class="card">
    <div class="section-title">卡片封面</div>
    <label>封面标题</label><input id="coverTitle" type="text">
    <label>封面第1条</label><input id="coverLine1" type="text" placeholder="例如：wR~：这里可以修改聊天内容">
    <label>封面第2条</label><input id="coverLine2" type="text" placeholder="例如：wR~：66">
    <label>封面第3条</label><input id="coverLine3" type="text" placeholder="例如：聊天记录">
    <label>封面图片网址</label><input id="coverImage" type="url" placeholder="https://.../white.jpg">
    <div class="preview">
      <div class="preview-text"><div class="preview-title" id="pTitle">封面标题</div><div class="preview-desc" id="pDesc">封面摘要</div></div>
      <img id="pImg" alt="">
    </div>
  </div>

  <div class="actions"><button class="secondary" id="loadBtn">重新读取</button><button class="primary" id="saveBtn">全部保存</button></div>
  <div id="status" class="status"></div>
</div>
<script>
const OWNER='yym199473', REPO='chat-view', BRANCH='main';
const API='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/';
const $=id=>document.getElementById(id);
let avatarBase64='';
const status=(msg,type='wait')=>{const e=$('status');e.textContent=msg;e.className='status '+type;};
function headers(auth=false){const h={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};if(auth){const t=$('token').value.trim();if(t)h['Authorization']='Bearer '+t;}return h}
function b64decode(v){const bin=atob(v.replace(/\n/g,'')),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
function b64encode(v){const u=new TextEncoder().encode(v);let bin='';for(const b of u)bin+=String.fromCharCode(b);return btoa(bin)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addRecord(r={name:'',time:'',text:''}){const d=document.createElement('div');d.className='record';d.innerHTML='<div class="record-grid"><input class="rname" placeholder="名称" value="'+esc(r.name)+'"><input class="rtime" placeholder="时间，例如 09:35:27" value="'+esc(r.time)+'"></div><textarea class="rtext" placeholder="聊天内容">'+esc(r.text)+'</textarea><button type="button" class="danger remove" style="width:100%;margin-top:8px;border-radius:8px;padding:8px">删除这条</button>';d.querySelector('.remove').onclick=()=>d.remove();$('records').appendChild(d)}
$('addRecord').onclick=()=>addRecord();

$('avatarFile').addEventListener('change',async e=>{
  const file=e.target.files&&e.target.files[0];
  if(!file)return;
  try{
    avatarBase64=await imageToJpegBase64(file);
    $('avatarPreview').src='data:image/jpeg;base64,'+avatarBase64;
  }catch(err){status('头像读取失败：'+err.message,'err')}
});

function imageToJpegBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('无法读取图片'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('图片格式无法识别'));
      img.onload=()=>{
        const size=400, c=document.createElement('canvas');
        c.width=size;c.height=size;
        const ctx=c.getContext('2d');
        const s=Math.min(img.width,img.height);
        const sx=(img.width-s)/2, sy=(img.height-s)/2;
        ctx.drawImage(img,sx,sy,s,s,0,0,size,size);
        resolve(c.toDataURL('image/jpeg',0.9).split(',')[1]);
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function getMeta(html,key){
  let m;
  if(key==='title') m=html.match(/<title>([\s\S]*?)<\/title>/i);
  else if(key.startsWith('name:')){
    const n=key.slice(5);
    m=html.match(new RegExp('<meta\\s+name=["\\\']'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'["\\\'][^>]*content=["\\\']([^"\\\']*)["\\\'][^>]*>','i'));
  }else{
    const n=key.startsWith('property:')?key.slice(9):key;
    m=html.match(new RegExp('<meta\\s+property=["\\\']'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'["\\\'][^>]*content=["\\\']([^"\\\']*)["\\\'][^>]*>','i'));
  }
  return m?m[1]:'';
}
function replaceMeta(html,key,value){
  const safe=String(value).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\r?\n/g,'&#10;');
  if(key==='title') return html.replace(/<title>[\s\S]*?<\/title>/i,'<title>'+safe+'</title>');
  const isName=key.startsWith('name:');
  const n=isName?key.slice(5):(key.startsWith('property:')?key.slice(9):key);
  const escName=n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const attr=isName?'name':'property';
  const re=new RegExp('(<meta\\s+'+attr+'=["\\\']'+escName+'["\\\'][^>]*content=["\\\'])[^"\\\']*(["\\\'][^>]*>)','i');
  if(re.test(html)) return html.replace(re,'$1'+safe+'$2');
  return html.replace('</head>','<meta '+attr+'="'+n+'" content="'+safe+'">\\n</head>');
}
function addVersion(url){
  const raw=String(url||'').trim();
  if(!raw) return raw;
  const clean=raw.replace(/([?&])v=\\d+/,'$1').replace(/[?&]$/,'');
  return clean+(clean.includes('?')?'&':'?')+'v='+Date.now();
}
async function fetchFile(path,auth=false){const r=await fetch(API+path+'?ref='+encodeURIComponent(BRANCH),{headers:headers(auth),cache:'no-store'});if(!r.ok)throw new Error(path+' 读取失败 HTTP '+r.status);return r.json()}
function getCoverDesc(){return [$('coverLine1').value.trim(),$('coverLine2').value.trim(),$('coverLine3').value.trim()].filter(Boolean).join('\n')}
function updatePreview(){$('pTitle').textContent=$('coverTitle').value||'封面标题';$('pDesc').textContent=getCoverDesc()||'封面摘要';$('pImg').src=$('coverImage').value||''}
['coverTitle','coverLine1','coverLine2','coverLine3','coverImage'].forEach(id=>$(id).addEventListener('input',updatePreview));
async function loadAll(){try{status('正在读取当前内容…');avatarBase64='';$('avatarFile').value='';$('avatarPreview').src='./avatar.jpg?ts='+Date.now();const [dj,ij]=await Promise.all([fetchFile('data.json'),fetchFile('index.html')]);const d=JSON.parse(b64decode(dj.content));const html=b64decode(ij.content);$('pageTitle').value=d.pageTitle||'';$('date').value=d.date||'';$('footer').value=d.footer||'';$('records').innerHTML='';(Array.isArray(d.records)?d.records:[]).forEach(addRecord);$('coverTitle').value=getMeta(html,'og:title')||getMeta(html,'title');const desc=(getMeta(html,'og:description')||'').replace(/&#10;|&#x0A;|&#xA;/gi,'\n');const parts=desc.includes('\n')?desc.split(/\n+/):desc.split('｜');$('coverLine1').value=(parts[0]||'').trim();$('coverLine2').value=(parts[1]||'').trim();$('coverLine3').value=(parts[2]||'').trim();$('coverImage').value=getMeta(html,'og:image');updatePreview();status('读取成功，可以直接修改。','ok')}catch(e){status(e.message,'err')}}
$('loadBtn').onclick=loadAll;
$('saveBtn').onclick=async()=>{
  const token=$('token').value.trim();
  if(!token){status('请先填写 GitHub 令牌。','err');return}
  try{
    status('正在保存封面和聊天内容，请不要关闭页面…');
    const [dj,ij]=await Promise.all([fetchFile('data.json',true),fetchFile('index.html',true)]);
    const records=[...document.querySelectorAll('.record')].map(r=>({name:r.querySelector('.rname').value,time:r.querySelector('.rtime').value,text:r.querySelector('.rtext').value}));
    const coverTitle=$('coverTitle').value.trim();
    const coverDesc=getCoverDesc();
    const versionedImage=addVersion($('coverImage').value.trim());
    const data={records,shareTitle:coverTitle,shareDescription:coverDesc,pageTitle:$('pageTitle').value.trim(),date:$('date').value.trim(),footer:$('footer').value};
    let html=b64decode(ij.content);
    html=replaceMeta(html,'title',coverTitle);
    html=replaceMeta(html,'name:description',coverDesc);
    html=replaceMeta(html,'property:og:title',coverTitle);
    html=replaceMeta(html,'property:og:description',coverDesc);
    html=replaceMeta(html,'property:og:image',versionedImage);
    const common={'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};

    // 如选择了新头像，则更新仓库中的 avatar.jpg；未选择时保持原头像不变。
    if(avatarBase64){
      let avatarSha='';
      try{
        const aj=await fetchFile('avatar.jpg',true);
        avatarSha=aj.sha||'';
      }catch(_){}
      const avatarBody={message:'Update chat avatar',content:avatarBase64,branch:BRANCH};
      if(avatarSha)avatarBody.sha=avatarSha;
      const ar=await fetch(API+'avatar.jpg',{method:'PUT',headers:common,body:JSON.stringify(avatarBody)});
      if(!ar.ok){let d='';try{d=(await ar.json()).message||''}catch(_){ }throw new Error('头像保存失败 HTTP '+ar.status+(d?' - '+d:''))}
    }

    // 先保存封面，确保封面修改不会因为后续聊天数据保存失败而丢失。
    let r=await fetch(API+'index.html',{method:'PUT',headers:common,body:JSON.stringify({message:'Update card cover',content:b64encode(html),sha:ij.sha,branch:BRANCH})});
    if(!r.ok){let d='';try{d=(await r.json()).message||''}catch(_){ }throw new Error('封面保存失败 HTTP '+r.status+(d?' - '+d:''))}

    r=await fetch(API+'data.json',{method:'PUT',headers:common,body:JSON.stringify({message:'Update chat content',content:b64encode(JSON.stringify(data,null,2)),sha:dj.sha,branch:BRANCH})});
    if(!r.ok){let d='';try{d=(await r.json()).message||''}catch(_){ }throw new Error('封面已保存，但聊天内容保存失败 HTTP '+r.status+(d?' - '+d:''))}

    $('coverImage').value=versionedImage;
    updatePreview();
    avatarBase64='';
    $('avatarFile').value='';
    $('avatarPreview').src='./avatar.jpg?ts='+Date.now();
    status('全部保存成功。只更新里面第一条内容头像；封面卡片仍保持原来的白色图片。公开页通常几十秒到几分钟更新。','ok');
  }catch(e){status(e.message,'err')}
};
loadAll();
</script>
</body>
</html>
